name: Performance Regression Detection

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log only, no PRs or issues)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      update_baseline:
        description: 'Update baseline from current scores (no regression check)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write
  pull-requests: write
  issues: write
  models: read

jobs:
  perf-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run performance agent
        run: |
          if [ "${{ github.event.inputs.update_baseline }}" = "true" ]; then
            node perf-agent/index.js --update-baseline
          else
            node perf-agent/index.js
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || vars.PERF_AGENT_DRY_RUN || 'false' }}

      - name: Commit updated baseline
        if: ${{ github.event.inputs.update_baseline == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/baselines/performance.json
          git diff --cached --quiet || git commit -m "chore: update perf baseline [skip ci]"
          git push
